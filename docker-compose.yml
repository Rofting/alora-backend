services:
  postgres:
    image: postgres:latest
    container_name: alora-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alora
    ports:
      - "5432:5432"
    volumes:
      - ./postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alora"]
      interval: 5s
      timeout: 5s
      retries: 10
